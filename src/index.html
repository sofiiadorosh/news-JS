<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
        <title>NewsPortal</title>
    </head>
    <body>
        <div class="container">
            <header class="header">
                <h1 class="header__title">News<span class="header__accent">Portal</span></h1>
                <p class="header__subtitle">Fresh headlines from hundreds of sources</p>
            </header>

            <main class="main">
                <section class="sources-section">
                    <h2 class="section-title">Sources</h2>
                    <div class="sources buttons"></div>
                </section>

                <section class="news-section">
                    <h2 class="section-title">Latest news</h2>
                    <div class="news"></div>
                </section>
            </main>

            <footer class="footer">
                <a
                    class="footer__github"
                    href="https://github.com/sofiiadorosh"
                    aria-label="GitHub profile"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <svg class="footer__icon" aria-hidden="true">
                        <use href="./assets/sprite.svg#icon-github"></use>
                    </svg>
                    <span>sofiiadorosh</span>
                </a>

                <p class="footer__copyright">
                    &copy; 2026 &middot; Data by <a class="footer__link" href="https://newsapi.org">NewsAPI</a>
                </p>

                <a
                    class="footer__course"
                    href="https://rs.school/courses/javascript"
                    aria-label="RS School JavaScript course"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <svg class="footer__course-logo" aria-hidden="true">
                        <use href="./assets/sprite.svg#icon-rs-school"></use>
                    </svg>
                </a>
            </footer>
        </div>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
